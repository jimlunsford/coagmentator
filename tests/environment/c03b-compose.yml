services:
  edge:
    volumes:
      - ../../.runtime/c03b-edge.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      isolated:
        aliases: [redirect.test]
  origin:
    image: ${NGINX_IMAGE:?Pinned Nginx image required}
    volumes:
      - ../../.runtime/wordpress/src:/workspace/.runtime/wordpress/src:ro
      - ./c03b-origin.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]
    networks: [isolated]
